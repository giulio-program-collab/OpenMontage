<style>
:root{
  --azul:#0E2440; --azul-2:#16304F; --azul-3:#21456E; --azul-0:#081627;
  --tile:#F7F5EF; --tile-line:#D9DCE3;
  --ink:#101820; --ink-soft:#5C6672;
  --cobalt:#3A6FD8; --ocre:#D9A227;
  --again:#C6503F; --hard:#B57B1E; --good:#2E7D52; --easy:#2E6BA8;
  --acc:var(--ocre);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--azul-0);color:#EAEFF6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  display:flex;justify-content:center}
#app{width:100%;max-width:780px;background:var(--azul);display:flex;flex-direction:column;min-height:100%}
@media(min-width:820px){
  body{padding:20px 0}
  #app{min-height:calc(100vh - 40px);border-radius:16px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.45)}
}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.09);flex:none}
svg.mark{width:26px;height:26px;flex:none;display:block}
.bar h1{font:600 16px/1.25 inherit;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{background:none;border:1px solid rgba(255,255,255,.22);color:#EAEFF6;border-radius:8px;
  padding:7px 11px;font:500 13px inherit;cursor:pointer;white-space:nowrap}
.ghost:hover{background:rgba(255,255,255,.07)}
.ghost:active{background:rgba(255,255,255,.12)}
.danger{color:#F0A79A;border-color:rgba(240,167,154,.4)}
.body{flex:1;padding:15px;overflow-y:auto}
.lead{margin:0 0 15px;color:#A9BBD1;font-size:14px;line-height:1.5}
.msg{background:var(--azul-2);border-left:3px solid var(--ocre);border-radius:8px;padding:11px 13px;
  font-size:13px;line-height:1.55;color:#D7E2F0;margin:0 0 14px}
.msg.bad{border-left-color:var(--again)}
.note{font-size:12px;color:#7F91A8;line-height:1.55;margin:12px 0 0}
h2.sec{font:600 12px/1 inherit;letter-spacing:.09em;text-transform:uppercase;color:#7F91A8;margin:22px 0 10px}
h2.sec:first-child{margin-top:0}

.theme{width:100%;text-align:left;background:var(--azul-2);border:1px solid rgba(255,255,255,.08);
  border-left:5px solid var(--acc);border-radius:10px;padding:13px 14px;margin-bottom:9px;
  color:inherit;font:inherit;cursor:pointer;display:block}
.theme:hover{background:#1A3859}
.theme:active{background:var(--azul-3)}
.theme .row{display:flex;align-items:baseline;gap:8px}
.theme .name{font-weight:600;font-size:15px;flex:1}
.theme .due{font-size:13px;color:var(--ocre);font-variant-numeric:tabular-nums;white-space:nowrap}
.theme .due.zero{color:#7F91A8}
.theme .sub{font-size:12.5px;color:#8FA3BC;margin-top:3px}
.meter{display:flex;height:5px;margin-top:9px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.1)}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:#8FA3BC;margin:2px 0 14px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

.modes{display:grid;gap:9px;margin-bottom:18px}
.mode{background:var(--azul-2);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:14px;
  color:inherit;font:inherit;text-align:left;cursor:pointer}
.mode:hover{background:#1A3859}
.mode b{display:block;font-size:15px;margin-bottom:3px}
.mode span{font-size:12.5px;color:#96AAC3;line-height:1.4}

.progress{height:3px;background:rgba(255,255,255,.12);flex:none}
.progress i{display:block;height:100%;background:var(--ocre);transition:width .3s}
.count{font-size:13px;color:#93A7C0;font-variant-numeric:tabular-nums}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
.tile{background:var(--tile);color:var(--ink);border-radius:12px;width:100%;max-width:560px;
  min-height:210px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.tile .prompt{font:400 17px/1.4 Georgia,serif;color:var(--ink-soft)}
.tile hr{border:0;border-top:1px solid var(--tile-line);width:130px;margin:15px 0}
.tile .answer{font:600 29px/1.25 Georgia,serif}
.tile .front{font:600 26px/1.3 Georgia,serif}
.tile .hint{margin-top:11px;font-size:15px;color:var(--ink-soft)}
.tile .ex{margin-top:13px;font:italic 400 16px/1.4 Georgia,serif;color:var(--acc)}
.tap{margin-top:18px;font-size:12px;color:#9AA4AF}

.actions{padding:11px 13px 15px;border-top:1px solid rgba(255,255,255,.09);flex:none}
.reveal{width:100%;padding:15px;border:0;border-radius:10px;background:var(--tile);color:var(--ink);
  font:600 16px inherit;cursor:pointer}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.grade{border:0;border-radius:10px;padding:12px 4px;color:#fff;font:600 14px inherit;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;align-items:center}
.grade small{font-weight:400;font-size:11px;opacity:.85}
.grade kbd{position:absolute;opacity:0}
.g0{background:var(--again)}.g1{background:var(--hard)}.g2{background:var(--good)}.g3{background:var(--easy)}

.q{font:600 23px/1.3 Georgia,serif;text-align:center;margin:6px 0 20px}
.qsub{text-align:center;color:#8FA3BC;font-size:13px;margin-bottom:22px}
.opts{display:grid;gap:8px}
.opt{background:var(--azul-2);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:14px;
  color:inherit;font:500 15px inherit;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover{background:#1A3859}
.opt em{font-style:normal;color:#7F91A8;font-size:12px;font-variant-numeric:tabular-nums;min-width:11px}
.opt.right{background:#1F5C3F;border-color:#2E7D52}
.opt.wrong{background:#5E2A22;border-color:var(--again)}
.opt.muted{opacity:.5}
input.txt,textarea.txt{width:100%;background:#0A1B31;border:1px solid rgba(255,255,255,.22);
  border-radius:9px;color:#EAEFF6;padding:13px;font:400 16px inherit}
input.txt:focus,textarea.txt:focus{outline:2px solid var(--cobalt);outline-offset:1px}
textarea.txt{min-height:150px;line-height:1.5;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#8FA3BC;margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--ocre);color:#1A1405;border:0;border-radius:10px;padding:14px 20px;
  font:600 15px inherit;cursor:pointer;width:100%}
.primary:hover{filter:brightness(1.06)}
.primary.slim{width:auto}
.primary[disabled]{opacity:.45;cursor:default;filter:none}
.rowbtn{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.rowbtn>*{flex:1;min-width:130px}
.verdict{margin-top:16px;padding:12px 14px;border-radius:9px;font-size:14px;line-height:1.5}
.verdict.ok{background:#1F5C3F}
.verdict.near{background:#6B5416}
.verdict.no{background:#5E2A22}
.verdict b{font-weight:600}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.list .de{flex:1;font-size:14px}
.list .es{flex:1;font-size:14px;color:#A9BBD1;font-family:Georgia,serif}
.list button{background:none;border:0;color:#7F91A8;font-size:18px;cursor:pointer;padding:4px 6px}
.list button:hover{color:#EAEFF6}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}

.sheet{background:var(--tile);color:var(--ink);border-radius:12px;padding:18px 20px}
.sheet h3{font:600 15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  margin:0 0 4px;color:var(--ink)}
.sheet p.hint{font:400 12.5px/1.5 inherit;color:var(--ink-soft);margin:0 0 14px}
ol.cloze{margin:0;padding:0 0 0 22px;font:400 16.5px/2.1 Georgia,serif}
ol.cloze li{margin-bottom:4px}
ol.cloze li::marker{color:var(--ink-soft);font-size:13px}
.cloze input{border:0;border-bottom:2px solid var(--acc);background:#EDE9DE;border-radius:4px 4px 0 0;
  font:600 16px inherit;padding:2px 6px;color:var(--ink);max-width:100%}
.cloze input.right{background:#CBE6D4;border-color:#2E7D52}
.cloze input.wrong{background:#F2D2CC;border-color:var(--again);text-decoration:line-through}
.cue{font:400 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#7A8290;margin-left:5px;white-space:nowrap}
.sol{color:var(--good);font-weight:600;font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.chip{background:var(--azul-2);border:1px solid rgba(255,255,255,.16);border-radius:20px;
  padding:7px 13px;font-size:13.5px;font-family:Georgia,serif;color:#D7E2F0}
.boot{padding:48px 24px;text-align:center;color:#A9BBD1;max-width:540px;margin:0 auto;
  font:400 14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.boot b{color:#EAEFF6}
.boot code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#F0A79A;
  display:block;margin-top:10px;word-break:break-word}
.done{text-align:center;padding:36px 20px}
.done .big{font:600 44px/1 Georgia,serif;color:var(--ocre);margin-bottom:6px}
.stats{display:flex;justify-content:center;gap:22px;margin:20px 0 24px;font-size:13px;color:#A9BBD1;flex-wrap:wrap}

/* =========================================================================
   Vokabeltrainer — Offline-Version
   Eine Datei, keine Abhängigkeiten, keine Netzverbindung nötig.
   Speichert im localStorage; läuft auch in der Claude-App (window.storage).
   Stand lässt sich als Textblock exportieren und importieren.
   ========================================================================= */

/* dieselbe Zeichnung wie das Favicon — als Marke in der Kopfzeile */
const MARK=("<svg class='mark' viewBox='0 0 64 64' aria-hidden='true'>"+
  "<rect width='64' height='64' rx='14' fill='%230E2440'/>"+
  "<rect x='16' y='12' width='37' height='27' rx='4' fill='%23D9A227' transform='rotate(-9 34.5 25.5)'/>"+
  "<rect x='12' y='19' width='40' height='29' rx='4.5' fill='%23F7F5EF'/>"+
  "<rect x='22' y='27.5' width='20' height='4.5' rx='2.25' fill='%23D9A227'/>"+
  "<rect x='22' y='36' width='20' height='4.5' rx='2.25' fill='%23D9A227'/></svg>").replace(/%23/g,"#");
const APP_ID="vokabeltrainer", MODEL_V=3, DAY=86400000;
const KDECK="vt.deck.v3", KPROG="vt.prog.v3";
const OLD_DECK="spanisch-deck-v2", OLD_PROG="spanisch-srs-v2";
const COLORS=["#B45309","#1D4ED8","#047857","#BE185D","#0E7490","#4D7C0F","#6D28D9","#A16207","#B91C1C","#0F766E"];
const DEFAULTS={dir:"a-b",newPerDay:15,srsFromExercises:true};

let deck=null;
let S={v:MODEL_V,dir:DEFAULTS.dir,newPerDay:DEFAULTS.newPerDay,srsFromExercises:DEFAULTS.srsFromExercises,
       cards:{},day:"",newDone:0,lastCourse:""};
let view={name:"home"}, sess=null, storageNote="";
const app=document.getElementById("app");

/* ---------- kleine Helfer ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const str=s=>typeof s==="string"?s.trim():(s==null?"":String(s).trim());
const today=()=>new Date().toISOString().slice(0,10);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Klammerzusätze wegwerfen: "el compromiso (Kompromiss = el acuerdo)" -> "el compromiso" */
const bare=s=>String(s).replace(/\s*\([^)]*\)\s*/g," ").trim();

/* Längentreue Faltung: gleiche Zeichenzahl wie das Original, damit Indizes passen. */
const FOLD={"á":"a","à":"a","ä":"a","â":"a","ã":"a","å":"a","é":"e","è":"e","ë":"e","ê":"e",
  "í":"i","ì":"i","ï":"i","î":"i","ó":"o","ò":"o","ö":"o","ô":"o","õ":"o","ú":"u","ù":"u","ü":"u","û":"u",
  "ñ":"n","ç":"c","ý":"y","ÿ":"y","š":"s","ž":"z","ø":"o","å":"a","ą":"a","ę":"e","ł":"l","ń":"n","ś":"s","ż":"z","ź":"z","č":"c","ř":"r","ě":"e","ů":"u","ğ":"g","ı":"i","ş":"s"};
const fold1=s=>String(s).toLowerCase().replace(/[^\x00-\x7f]/g,c=>FOLD[c]||c);
/* Vergleichsform: Akzente, Satzzeichen und Mehrfach-Leerzeichen weg. */
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[¿?¡!.,;:„“"'()\[\]]/g,"").replace(/\s+/g," ").trim();
const ARTS=/^(el|la|los|las|un|una|unos|unas|der|die|das|den|dem|ein|eine|einen|einem|einer|the|a|an|to|le|les|il|lo|gli|o|os|as)\s+/;
/* Funktionswörter taugen nicht als Suchanker für eine Lücke */
const STOP={to:1,the:1,a:1,an:1,with:1,from:1,into:1,that:1,this:1,over:1,down:1,back:1,out:1,off:1,
  about:1,upon:1,onto:1,for:1,and:1,one:1,ones:1,oneself:1,someone:1,something:1,somebody:1,sth:1,sb:1,
  not:1,but:1,its:1,his:1,her:1,their:1,our:1,your:1};
const dropArt=s=>String(s).replace(ARTS,"");

function dist(a,b){ /* Levenshtein, für Tippfehler-Toleranz */
  if(Math.abs(a.length-b.length)>2)return 9;
  const m=a.length,n=b.length,dp=[];
  for(let j=0;j<=n;j++)dp[j]=j;
  for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;
    for(let j=1;j<=n;j++){const t=dp[j];
      dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}
  return dp[n];
}
/* "yes" | "near" (Tippfehler) | "no" */
function check(input,answer){
  const i=norm(input); if(!i)return "no";
  const cand=[];
  bare(answer).split("/").forEach(x=>{const n=norm(x);if(n){cand.push(n);cand.push(dropArt(n));}});
  const mine=[i,dropArt(i)];
  if(cand.some(c=>mine.indexOf(c)>=0))return "yes";
  if(cand.some(c=>c.length>=5&&mine.some(m=>dist(c,m)<=1)))return "near";
  return "no";
}

/* ---------- Speicher: Claude-Runtime oder localStorage ---------- */
const cloud=(typeof window.storage==="object"&&window.storage&&typeof window.storage.get==="function")?window.storage:null;
const store={
  async get(k){
    try{
      if(cloud){const r=await cloud.get(k);return r&&r.value!=null?r.value:null;}
      return localStorage.getItem(k);
    }catch(e){return null}
  },
  async set(k,v){
    if(cloud){await cloud.set(k,v);return}
    localStorage.setItem(k,v);
  }
};
let pt=null;
function saveProg(now){
  clearTimeout(pt);
  const go=async()=>{try{await store.set(KPROG,JSON.stringify(S));storageNote=""}
    catch(e){storageNote="Speichern klappt gerade nicht — Änderungen gelten nur für diese Sitzung.";}};
  if(now)return go(); pt=setTimeout(go,1000);
}
async function saveDeck(){
  try{await store.set(KDECK,JSON.stringify(deck));storageNote=""}
  catch(e){storageNote="Speichern klappt gerade nicht — Änderungen gelten nur für diese Sitzung.";render()}
}

/* ---------- Datenmodell: Kurs > Thema > Vokabel ---------- */
function normCard(c){
  if(!c||typeof c!=="object")return null;
  const a=str(c.a!=null?c.a:c.de), b=str(c.b!=null?c.b:c.es);
  if(!a||!b)return null;
  return {id:String(c.id||nid("v")),a,b,ex:str(c.ex!=null?c.ex:c.example)};
}
function normTheme(t,i){
  if(!t||typeof t!=="object")return null;
  const cards=(Array.isArray(t.cards)?t.cards:[]).map(normCard).filter(Boolean);
  return {id:String(t.id||nid("t")),name:str(t.name)||"Thema "+(i+1),
    color:str(t.color)||COLORS[i%COLORS.length],cards};
}
function normCourse(c,i){
  if(!c||typeof c!=="object")return null;
  const themes=(Array.isArray(c.themes)?c.themes:[]).map(normTheme).filter(Boolean);
  const name=str(c.name)||"Kurs "+(i+1);
  const out={id:String(c.id||nid("k")),name,
    from:str(c.from!=null?c.from:c.langA)||"Deutsch",
    to:str(c.to!=null?c.to:c.langB)||name,
    color:str(c.color)||COLORS[i%COLORS.length],themes};
  if(c.dir==="a-b"||c.dir==="b-a"||c.dir==="mix")out.dir=c.dir;
  else if(c.dir==="de-es")out.dir="a-b"; else if(c.dir==="es-de")out.dir="b-a";
  return out;
}
/* Nimmt v3-Decks, alte Spanisch-Decks ({themes:[{de,es}]}) und blanke Theme-Listen. */
function normalizeDeck(raw){
  if(!raw||typeof raw!=="object")return null;
  let src=null;
  if(Array.isArray(raw.courses))src=raw.courses;
  else if(Array.isArray(raw.themes))src=[{id:"c-es",name:"Spanisch",from:"Deutsch",to:"Spanisch",color:"#D9A227",themes:raw.themes,dir:raw.dir}];
  else if(Array.isArray(raw))src=[{id:"c-es",name:"Spanisch",from:"Deutsch",to:"Spanisch",color:"#D9A227",themes:raw}];
  if(!src)return null;
  const courses=src.map(normCourse).filter(Boolean);
  return courses.length?{v:MODEL_V,courses}:null;
}
function normalizeProg(raw){
  if(!raw||typeof raw!=="object")return null;
  const dirMap={"de-es":"a-b","es-de":"b-a","a-b":"a-b","b-a":"b-a","mix":"mix"};
  const cards={};
  const src=(raw.cards&&typeof raw.cards==="object"&&!Array.isArray(raw.cards))?raw.cards:{};
  Object.keys(src).forEach(k=>{
    const s=src[k]; if(!s||typeof s!=="object")return;
    cards[k]={ef:+s.ef||2.5,iv:+s.iv||0,reps:+s.reps||0,lapses:+s.lapses||0,due:+s.due||0};
  });
  return {dir:dirMap[raw.dir]||DEFAULTS.dir,
    newPerDay:+raw.newPerDay>0?+raw.newPerDay:DEFAULTS.newPerDay,
    srsFromExercises:raw.srsFromExercises!==false,
    day:str(raw.day),newDone:+raw.newDone||0,lastCourse:str(raw.lastCourse),cards};
}

/* ---------- Zugriff ---------- */
const courseById=id=>deck.courses.find(c=>c.id===id)||null;
function themeById(cid,tid){const c=courseById(cid);return c?c.themes.find(t=>t.id===tid)||null:null;}
const dirOf=c=>(c&&c.dir)||S.dir;
function cardsOf(cid,tid){
  const out=[];
  (cid?[courseById(cid)]:deck.courses).forEach(c=>{
    if(!c)return;
    (tid?[c.themes.find(t=>t.id===tid)]:c.themes).forEach(t=>{
      if(!t)return;
      t.cards.forEach(k=>out.push({id:k.id,a:k.a,b:k.b,ex:k.ex,acc:t.color,theme:t.name,tid:t.id,cid:c.id}));
    });
  });
  return out;
}
const st=id=>S.cards[id];
const isDue=id=>{const s=st(id);return !!s&&s.due<=Date.now()};
function stats(cid,tid){
  const cs=cardsOf(cid,tid);let neu=0,lern=0,sicher=0,due=0;
  cs.forEach(c=>{const s=st(c.id);
    if(!s)neu++;else if(s.iv>=21)sicher++;else lern++;
    if(s&&s.due<=Date.now())due++;});
  return {neu,lern,sicher,due,total:cs.length};
}
function allCardIds(){const m=new Map();deck.courses.forEach(c=>c.themes.forEach(t=>t.cards.forEach(k=>m.set(k.id,k))));return m;}

/* ---------- Wiederholungsplan (SM-2, vereinfacht) ---------- */
function preview(s,g){
  const e=s?s.ef:2.5, iv=s?s.iv:0;
  if(g===0)return 0;
  if(g===1)return iv?Math.max(1,Math.round(iv*1.2)):1;
  if(g===2)return iv?Math.round(iv*e):1;
  return iv?Math.round(iv*e*1.3):3;
}
const label=d=>d===0?"gleich":d===1?"1 Tag":d<30?d+" Tage":(Math.round(d/30)===1?"1 Monat":Math.round(d/30)+" Monate");
function apply(cardId,g){
  const prev=S.cards[cardId];
  const s=prev||{ef:2.5,iv:0,reps:0,lapses:0,due:0};
  if(!prev)S.newDone++;
  if(g===0){s.ef=Math.max(1.3,s.ef-0.2);s.lapses++;}
  if(g===1)s.ef=Math.max(1.3,s.ef-0.15);
  if(g===3)s.ef=Math.min(3,s.ef+0.15);
  s.iv=preview(prev,g);s.reps++;
  s.due=Date.now()+(s.iv?s.iv*DAY:0);
  S.cards[cardId]=s;saveProg();
}

/* ---------- Runden ---------- */
function startCards(cid,tid){
  const pool=cardsOf(cid,tid);
  const due=pool.filter(c=>isDue(c.id)).sort((a,b)=>st(a.id).due-st(b.id).due);
  const fresh=pool.filter(c=>!st(c.id)).slice(0,Math.max(0,S.newPerDay-S.newDone));
  let q=[],extra=false;
  for(let i=0;i<Math.max(due.length,fresh.length);i++){if(due[i])q.push(due[i]);if(fresh[i])q.push(fresh[i]);}
  if(!q.length){
    q=pool.filter(c=>st(c.id)).sort((a,b)=>st(a.id).due-st(b.id).due).slice(0,20);extra=true;
    if(!q.length){
      view={name:tid?"theme":"course",cid,tid,
        msg:"Hier ist für heute alles erledigt. In den Einstellungen kannst du mehr neue Karten pro Tag freigeben."};
      return render();
    }
  }
  sess={mode:"cards",queue:q,total:q.length,answered:0,done:0,again:0,shown:false,cid,tid,extra,dir:null};
  view={name:"study"};render();
}
function startExercise(cid,tid){
  const pool=cardsOf(cid,tid);
  if(pool.length<2){
    view={name:"theme",cid,tid,msg:"Für Übungen brauchst du mindestens zwei Vokabeln in diesem Thema."};
    return render();
  }
  const weak=pool.filter(c=>{const s=st(c.id);return !s||s.due<=Date.now()||s.iv<7});
  const base=shuffle(weak.length>=8?weak:pool).slice(0,10);
  sess={mode:"ex",queue:base,total:base.length,i:0,right:0,pool,cid,tid,phase:"ask"};
  nextQ();view={name:"exercise"};render();
}
function nextQ(){
  const c=sess.queue[sess.i];if(!c)return;
  const set=dirOf(courseById(sess.cid||c.cid));
  const dir=set==="mix"?(Math.random()<.5?"a-b":"b-a"):set;
  const type=(sess.pool.length>=4&&sess.i%2===0)?"mc":"type";
  let opts=null;
  if(type==="mc"){
    const others=shuffle(sess.pool.filter(x=>x.id!==c.id)).slice(0,3);
    opts=shuffle([c].concat(others)).map(x=>({id:x.id,txt:dir==="a-b"?bare(x.b):bare(x.a)}));
  }
  sess.q={card:c,dir,type,opts,picked:null,input:"",ok:null};
  sess.phase="ask";
}
function answerEx(res){
  sess.q.ok=res;sess.phase="feedback";
  if(res!=="no")sess.right++;
  if(S.srsFromExercises)apply(sess.q.card.id,res==="yes"?2:res==="near"?1:0);
  render();
}

/* ---------- Lückentext, offline aus den Beispielsätzen ---------- */
function findForm(card){
  const sent=card.ex;if(!sent)return null;
  const f=fold1(sent);
  const isLetter=ch=>/[\p{L}\p{M}]/u.test(ch);
  /* nur Treffer am Wortanfang — sonst steckt "put" in "computer" */
  const findAt=needle=>{
    let i=f.indexOf(needle);
    while(i>=0){if(i===0||!isLetter(f[i-1]))return i;i=f.indexOf(needle,i+1);}
    return -1;
  };
  const terms=bare(card.b).split("/").map(x=>x.trim()).filter(Boolean);
  for(let t=0;t<terms.length;t++){
    const full=dropArt(fold1(terms[t])).trim();
    if(full.length<3)continue;
    const i=findAt(full);
    if(i>=0)return {i,len:full.length};
    /* sonst das erste inhaltstragende Wort, auch gebeugt: "curtail" findet "curtailed" */
    const words=full.split(/\s+/).filter(w=>w.length>=3&&!STOP[w]);
    for(let w=0;w<words.length;w++){
      const stem=words[w].slice(0,Math.max(3,words[w].length-2));
      const j=findAt(stem);
      if(j<0)continue;
      let e=j+stem.length;while(e<sent.length&&isLetter(sent[e]))e++;
      return {i:j,len:e-j};
    }
  }
  return null;
}
function buildCloze(cid,tid){
  const pool=cardsOf(cid,tid).filter(c=>c.ex&&c.ex.trim().length>6);
  const usable=[];
  pool.forEach(c=>{const hit=findForm(c);if(hit)usable.push({c,hit});});
  if(usable.length<3)
    return {error:"Für einen Lückentext brauche ich mindestens drei Vokabeln mit Beispielsatz in diesem Thema. "+
      "Trag bei ein paar Vokabeln einen Beispielsatz ein — der Satz muss das Wort enthalten."};
  const pick=shuffle(usable).slice(0,6);
  const gaps=pick.map((u,n)=>{
    const s=u.c.ex, hit=u.hit;
    return {n:n+1,pre:s.slice(0,hit.i),post:s.slice(hit.i+hit.len),
      answer:s.substr(hit.i,hit.len),hint:bare(u.c.a),cardId:u.c.id};
  });
  return {gaps};
}

/* ---------- Export / Import ---------- */
function progSnapshot(){
  return {dir:S.dir,newPerDay:S.newPerDay,srsFromExercises:S.srsFromExercises,
    day:S.day,newDone:S.newDone,lastCourse:S.lastCourse,cards:S.cards};
}
function buildExport(withProgress,pretty){
  const o={app:APP_ID,format:1,v:MODEL_V,at:new Date().toISOString(),deck:deck};
  if(withProgress)o.progress=progSnapshot();
  return JSON.stringify(o,null,pretty?1:0);
}
function parseBlock(text){
  const t=String(text||"").trim();
  if(!t)throw new Error("Der Textblock ist leer.");
  let raw=null;
  try{raw=JSON.parse(t)}
  catch(e){
    const s=t.indexOf("{"),e2=t.lastIndexOf("}");
    if(s<0||e2<=s)throw new Error("Das ist kein gültiger Datenblock (JSON erwartet).");
    try{raw=JSON.parse(t.slice(s,e2+1))}
    catch(e3){throw new Error("Der Block ist beschädigt — vermutlich beim Kopieren abgeschnitten.")}
  }
  if(!raw||typeof raw!=="object")throw new Error("Das ist kein gültiger Datenblock.");
  const deckSrc=raw.deck||(raw.courses||raw.themes?raw:(Array.isArray(raw)?raw:null));
  const progSrc=raw.progress||(raw.cards&&typeof raw.cards==="object"&&!Array.isArray(raw.cards)?raw:null);
  const d=deckSrc?normalizeDeck(deckSrc):null;
  const p=progSrc?normalizeProg(progSrc):null;
  if(!d&&!p)throw new Error("In diesem Block stecken weder Vokabeln noch ein Lernstand.");
  let cards=0;
  if(d)d.courses.forEach(c=>c.themes.forEach(t=>cards+=t.cards.length));
  return {deck:d,prog:p,at:str(raw.at||raw.exportedAt),
    sum:{courses:d?d.courses.length:0,cards,states:p?Object.keys(p.cards).length:0}};
}
const eqName=(a,b)=>norm(a)===norm(b)&&norm(a)!=="";
const samePair=(x,y)=>norm(x.a)===norm(y.a)&&norm(x.b)===norm(y.b);
function applyImport(parsed,mode){
  const r={courses:0,themes:0,cards:0,states:0,skipped:0};
  if(mode==="replace"){
    if(parsed.deck)deck=parsed.deck;
    if(parsed.prog){
      S.cards=parsed.prog.cards;S.dir=parsed.prog.dir;S.newPerDay=parsed.prog.newPerDay;
      S.srsFromExercises=parsed.prog.srsFromExercises;
      S.day=parsed.prog.day||today();S.newDone=parsed.prog.newDone;
      if(S.day!==today()){S.day=today();S.newDone=0;}
      r.states=Object.keys(S.cards).length;
    }
    if(parsed.deck){parsed.deck.courses.forEach(c=>{r.courses++;c.themes.forEach(t=>{r.themes++;r.cards+=t.cards.length})});}
    S.lastCourse="";
    return r;
  }
  /* Zusammenführen: nichts Lokales geht verloren. */
  const remap={};
  let idx=allCardIds();
  if(parsed.deck)parsed.deck.courses.forEach(ic=>{
    let lc=deck.courses.find(c=>c.id===ic.id)||deck.courses.find(c=>eqName(c.name,ic.name));
    if(!lc){lc={id:deck.courses.some(c=>c.id===ic.id)?nid("k"):ic.id,name:ic.name,from:ic.from,to:ic.to,
      color:ic.color,themes:[]};if(ic.dir)lc.dir=ic.dir;deck.courses.push(lc);r.courses++;}
    ic.themes.forEach(it=>{
      let lt=lc.themes.find(t=>t.id===it.id)||lc.themes.find(t=>eqName(t.name,it.name));
      if(!lt){lt={id:lc.themes.some(t=>t.id===it.id)?nid("t"):it.id,name:it.name,color:it.color,cards:[]};
        lc.themes.push(lt);r.themes++;}
      it.cards.forEach(ic2=>{
        let target=idx.get(ic2.id)||null;
        if(!target)target=lt.cards.find(x=>samePair(x,ic2))||null;
        if(target){
          remap[ic2.id]=target.id;
          if(!target.ex&&ic2.ex)target.ex=ic2.ex;
        }else{
          const id=idx.has(ic2.id)?nid("v"):ic2.id;
          const nc={id,a:ic2.a,b:ic2.b,ex:ic2.ex};
          lt.cards.push(nc);idx.set(id,nc);remap[ic2.id]=id;r.cards++;
        }
      });
    });
  });
  if(parsed.prog){
    idx=allCardIds();
    const better=(x,y)=>(x.reps||0)!==(y.reps||0)?(x.reps||0)>(y.reps||0):(x.due||0)>(y.due||0);
    Object.keys(parsed.prog.cards).forEach(k=>{
      const id=remap[k]||k;
      if(!idx.has(id)){r.skipped++;return}
      const inc=parsed.prog.cards[k],cur=S.cards[id];
      if(!cur||better(inc,cur)){S.cards[id]=inc;r.states++;}
    });
    if(parsed.prog.day===today())S.newDone=Math.max(S.newDone,parsed.prog.newDone);
  }
  return r;
}

/* --- Lückentext --- */
function cloze(){
  const t=sess.tid?themeById(sess.cid,sess.tid):null;
  const head=`<div class="bar"><button class="ghost" ${A(sess.tid?"theme":"course",sess.cid||"",sess.tid||"")}>Zurück</button>
    <h1>Lückentext</h1></div>`;
  if(sess.error)return `<div class="screen">${head}<div class="body"><p class="msg">${esc(sess.error)}</p>
    ${sess.tid?`<button class="ghost" ${A("list",sess.cid,sess.tid)}>Vokabeln bearbeiten</button>`:""}</div></div>`;
  const gaps=sess.gaps;
  const text=gaps.map(h=>{
    const v=sess.vals[h.n]||"";
    let cl="";
    if(sess.checked)cl=check(v,h.answer)!=="no"?"right":"wrong";
    const w=Math.max(80,Math.min(220,String(h.answer).length*12));
    return `<li>${esc(h.pre)}<input class="gap ${cl}" data-n="${h.n}" value="${esc(v)}"
      style="width:${w}px" ${sess.checked?"disabled":""} autocomplete="off" autocapitalize="none"
      spellcheck="false"><span class="cue">(${esc(h.hint)})</span>${esc(h.post)}`
      +(sess.checked&&cl==="wrong"?` <span class="sol">→ ${esc(h.answer)}</span>`:"")+`</li>`;
  }).join("");
  const right=sess.checked?gaps.filter(h=>check(sess.vals[h.n]||"",h.answer)!=="no").length:0;
  return `<div class="screen" style="--acc:${t?esc(t.color):"var(--ocre)"}">${head}
    <div class="body">
      <div class="sheet"><h3>${esc(t?t.name:"Gemischt")}</h3>
        <p class="hint">Setz die passende Form ein. In Klammern steht die Bedeutung.</p>
        <ol class="cloze">${text}</ol></div>
      <div class="bank">${(sess.bank||gaps).map(h=>`<span class="chip">${esc(h.answer)}</span>`).join("")}</div>
      <div style="height:12px"></div>
      ${sess.checked
        ?`<p class="lead">${right} von ${gaps.length} Lücken richtig.</p>
          <button class="primary" ${A("cloze",sess.cid||"",sess.tid||"")}>Neuer Text</button>`
        :`<button class="primary" ${A("checkcloze")}>Prüfen</button>`}
      <p class="note">Die Sätze stammen aus den Beispielsätzen deiner Vokabeln — dafür braucht der Lückentext
      keine Verbindung. Das Wortfeld zeigt alle gesuchten Formen in zufälliger Reihenfolge.</p>
    </div></div>`;
}

function render(){
  const v=view.name;
  const html=
    v==="course"?courseScreen():
    v==="theme"?themeScreen():

    v==="cardform"?cardForm():
    v==="bulk"?bulkForm():
    v==="themeform"?themeForm():
    v==="courseform"?courseForm():
    v==="study"?(sess&&sess.queue.length?study():finish()):
    v==="exercise"?exercise():
    v==="cloze"?cloze():
    v==="settings"?settings():

/* ==================== Eingaben ==================== */
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
const raw=id=>{const e=document.getElementById(id);return e?e.value:""};
function go(v){view=v;render()}
function keepBlock(){if(view.name==="data"){const e=document.getElementById("f-block");if(e)view.block=e.value;}}
function backFrom(cid,tid){return tid?{name:"theme",cid,tid}:(cid?{name:"course",cid}:{name:"home"})}

/* Datei sichern: in der Claude-Umgebung über die Download-Fähigkeit,
   lokal über einen gewöhnlichen Download-Link. */
async function saveFile(name,text){
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const dl=await window.claude.use("downloads");
      if(dl&&typeof dl.save==="function"){
        await dl.save({filename:name,data:text});
        return "saved";
      }
    }
  }catch(err){return (err&&err.code==="declined")?"declined":"fail"}
  try{
    const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    const el=document.createElement("a");
    el.href=url;el.download=name;
    document.body.appendChild(el);el.click();el.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    return "started";
  }catch(err){return "fail"}
}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{
    const a=document.getElementById("f-block");
    if(!a)return false;
    a.focus();a.select();
    const ok=document.execCommand("copy");
    return !!ok;
  }catch(e){return false}
}

app.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");
  if(!t)return;
  const act=t.dataset.act, a=t.dataset.a, b=t.dataset.b;
  keepBlock();keepForm();

  switch(act){
    case "view": sess=null; saveProg(true); return go({name:a});
    case "course": return go(a?{name:"course",cid:a}:{name:"home"});
    case "theme": return go(backFrom(a,b));
    case "list": return go({name:"list",cid:a,tid:b});
    case "cards": sess=null; return startCards(a,b);
    case "ex": sess=null; return startExercise(a,b);
    case "cloze": {
      const r=buildCloze(a,b);
      sess={mode:"cloze",cid:a,tid:b,vals:{},checked:false,gaps:r.gaps,error:r.error,
        bank:r.gaps?shuffle(r.gaps):null};
      return go({name:"cloze"});
    }
    case "endstudy": {const back=backFrom(sess&&sess.cid,sess&&sess.tid);sess=null;saveProg(true);return go(back)}

    /* --- Vokabeln --- */
    case "cardform": return go({name:"cardform",cid:a,tid:b});
    case "editcard": {const[cid,tid]=a.split("|");return go({name:"cardform",cid,tid,cardId:b})}
    case "savecard": {
      const A1=val("f-a"),B1=val("f-b"),ex=val("f-ex");
      if(!A1||!B1){view.msg="Bitte beide Seiten ausfüllen.";view.bad=true;return render()}
      const th=themeById(a,b);if(!th)return;
      if(view.cardId){const k=th.cards.find(x=>x.id===view.cardId);if(k)Object.assign(k,{a:A1,b:B1,ex});}
      else th.cards.push({id:nid("v"),a:A1,b:B1,ex});
      await saveDeck();
      return go({name:"list",cid:a,tid:b});
    }
    case "delcard": {
      if(!view.armed){view.armed=true;return render()}
      const[cid,tid]=a.split("|");const th=themeById(cid,tid);
      if(th)th.cards=th.cards.filter(x=>x.id!==b);
      delete S.cards[b];
      await saveDeck();saveProg(true);
      return go({name:"list",cid,tid});
    }
    case "bulk": return go({name:"bulk",cid:a,tid:b});
    case "savebulk": {
      const th=themeById(a,b);if(!th)return;
      let n=0;
      raw("f-bulk").split("\n").forEach(line=>{
        const p=line.split(/\s*=\s*|\t|\s*;\s*/).map(x=>x.trim()).filter(Boolean);
        if(p.length>=2){th.cards.push({id:nid("v"),a:p[0],b:p[1],ex:p[2]||""});n++;}
      });
      await saveDeck();
      return go({name:"list",cid:a,tid:b,msg:n?n+(n===1?" Vokabel":" Vokabeln")+" hinzugefügt.":"Keine gültige Zeile gefunden.",bad:!n});
    }

    /* --- Themen --- */
    case "themeform": return go({name:"themeform",cid:a,tid:b});
    case "savetheme": {
      const name=val("f-name");
      if(!name){view.msg="Bitte einen Namen eingeben.";view.bad=true;return render()}
      const c=courseById(a);if(!c)return;
      const color=view.color||(b?(themeById(a,b)||{}).color:COLORS[c.themes.length%COLORS.length]);
      if(b){const th=themeById(a,b);if(th)Object.assign(th,{name,color});await saveDeck();return go({name:"theme",cid:a,tid:b})}
      const id=nid("t");c.themes.push({id,name,color,cards:[]});
      await saveDeck();
      return go({name:"list",cid:a,tid:id});
    }
    case "deltheme": {
      if(!view.armed){view.armed=true;return render()}
      const c=courseById(a);if(!c)return;
      const th=themeById(a,b);if(th)th.cards.forEach(k=>delete S.cards[k.id]);
      c.themes=c.themes.filter(x=>x.id!==b);
      await saveDeck();saveProg(true);
      return go({name:"course",cid:a,msg:"Thema gelöscht."});
    }

    /* --- Kurse --- */
    case "courseform": return go({name:"courseform",cid:a});
    case "savecourse": {
      const name=val("f-cname"),from=val("f-from")||"Deutsch",to=val("f-to")||name;
      if(!name){view.msg="Bitte einen Namen eingeben.";view.bad=true;return render()}
      if(a){const c=courseById(a);if(c)Object.assign(c,{name,from,to,color:view.color||c.color});
        await saveDeck();return go({name:"course",cid:a})}
      const id=nid("k");
      deck.courses.push({id,name,from,to,color:view.color||COLORS[deck.courses.length%COLORS.length],themes:[]});
      await saveDeck();
      return go({name:"course",cid:id,msg:"Kurs angelegt. Leg jetzt ein erstes Thema an."});
    }
    case "delcourse": {
      if(!view.armed){view.armed=true;return render()}
      const c=courseById(a);
      if(c)c.themes.forEach(th=>th.cards.forEach(k=>delete S.cards[k.id]));
      deck.courses=deck.courses.filter(x=>x.id!==a);
      await saveDeck();saveProg(true);
      return go({name:"home",msg:"Kurs gelöscht."});
    }
    case "color": view.color=a; return render();
    case "cdir": {
      const c=courseById(a);if(!c)return;
      c.dir=b;await saveDeck();return render();
    }

    /* --- Karteikarten --- */
    case "reveal": if(sess&&!sess.shown){sess.shown=true;render()} return;
    case "grade": {
      if(!sess||!sess.shown)return;
      const c=sess.queue.shift(),g=+a;
      apply(c.id,g);sess.answered++;
      if(g===0){sess.again++;sess.queue.splice(Math.min(3,sess.queue.length),0,c);}else sess.done++;
      sess.shown=false;sess.dir=null;
      if(!sess.queue.length)saveProg(true);
      return render();
    }

    /* --- Übungen --- */
    case "pick": {
      if(!sess||sess.phase!=="ask")return;
      sess.q.picked=a;
      return answerEx(a===sess.q.card.id?"yes":"no");
    }
    case "check": {
      if(!sess||sess.phase!=="ask")return;
      const inp=val("f-ans");if(!inp)return;
      sess.q.input=inp;
      const sol=sess.q.dir==="a-b"?sess.q.card.b:sess.q.card.a;
      return answerEx(check(inp,sol));
    }
    case "nextq": {
      if(!sess)return;
      sess.i++;if(sess.i<sess.total)nextQ();
      if(sess.i>=sess.total)saveProg(true);
      return render();
    }
    case "checkcloze": {
      if(!sess||sess.checked)return;
      app.querySelectorAll(".gap").forEach(g=>sess.vals[g.dataset.n]=g.value);
      sess.checked=true;
      if(S.srsFromExercises)sess.gaps.forEach(h=>apply(h.cardId,check(sess.vals[h.n]||"",h.answer)!=="no"?2:0));
      saveProg(true);
      return render();
    }

    /* --- Einstellungen --- */
    case "set": {
      S[a]=b==="true"?true:b==="false"?false:(isNaN(b)?b:+b);
      saveProg(true);return render();
    }
    case "reset": {
      if(!view.armed){view.armed=true;return render()}
      S.cards={};S.newDone=0;saveProg(true);
      return go({name:"settings",msg:"Lernfortschritt zurückgesetzt."});
    }

    /* --- Export / Import --- */
    case "dopt": view[a]=b; return render();
    case "mkexport": {
      const what=view.what||"all";
      view.block=what==="prog"
        ? JSON.stringify({app:APP_ID,format:1,v:MODEL_V,at:new Date().toISOString(),progress:progSnapshot()})
        : buildExport(what==="all",false);
      view.msg="Block erzeugt. Jetzt kopieren und in der anderen Version einfügen.";view.bad=false;
      return render();
    }
    case "copy": {
      const text=raw("f-block");
      if(!text){view.msg="Erzeuge zuerst einen Block.";view.bad=true;return render()}
      const ok=await copyText(text);
      view.msg=ok?"In die Zwischenablage kopiert.":"Kopieren wurde blockiert — markiere den Text im Feld und kopiere ihn von Hand.";
      view.bad=!ok;return render();
    }
    case "download": {
      const text=raw("f-block");
      if(!text){view.msg="Erzeuge zuerst einen Block.";view.bad=true;return render()}
      const res=await saveFile("vokabeln-"+today()+".json",text);
      view.msg=res==="saved"?"Datei gesichert."
        :res==="started"?"Datei gesichert. Falls nichts passiert ist, blockiert der Browser den Download — dann kopieren."
        :res==="declined"?"Speichern abgebrochen."
        :"Download hier nicht möglich — nutze „Kopieren“.";
      view.bad=(res==="fail");
      return render();
    }
    case "pickfile": {const f=document.getElementById("f-file");if(f)f.click();return}
    case "clearblock": view.block="";view.parsed=null;view.msg="";return render();
    case "inspect": {
      try{
        view.parsed=parseBlock(view.block);
        view.msg="";view.bad=false;view.armed=false;
      }catch(err){view.parsed=null;view.msg=err.message;view.bad=true}
      return render();
    }
    case "import": {
      if(!view.parsed){view.msg="Bitte erst „Block prüfen“.";view.bad=true;return render()}
      if(a==="replace"&&!view.armed){view.armed=true;return render()}
      const r=applyImport(view.parsed,a);
      await saveDeck();saveProg(true);
      const bits=[];
      if(a==="replace")bits.push("Alles ersetzt: "+r.cards+" Vokabeln, "+r.states+" Lernstände");
      else{
        bits.push(r.cards+(r.cards===1?" neue Vokabel":" neue Vokabeln"));
        if(r.themes)bits.push(r.themes+(r.themes===1?" neues Thema":" neue Themen"));
        if(r.courses)bits.push(r.courses+(r.courses===1?" neuer Kurs":" neue Kurse"));
        bits.push(r.states+" Lernstände übernommen");
        if(r.skipped)bits.push(r.skipped+" ohne passende Vokabel übersprungen");
      }
      view={name:"data",what:view.what||"all",msg:bits.join(" · ")+"."};
      return render();
    }
  }
});

app.addEventListener("change",e=>{
  if(e.target.id!=="f-file")return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    view.block=String(rd.result||"");
    try{view.parsed=parseBlock(view.block);view.msg="Datei gelesen.";view.bad=false}
    catch(err){view.parsed=null;view.msg=err.message;view.bad=true}
    render();
  };
  rd.onerror=()=>{view.msg="Die Datei ließ sich nicht lesen.";view.bad=true;render()};
  rd.readAsText(f);
});

app.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="f-ans"){e.preventDefault();
    const btn=app.querySelector('[data-act="check"]')||app.querySelector('[data-act="nextq"]');
    if(btn)btn.click();return;}
  if(e.target.classList&&e.target.classList.contains("gap")){e.preventDefault();
    const gaps=[].slice.call(app.querySelectorAll(".gap"));
    const i=gaps.indexOf(e.target);
    if(i>=0&&i<gaps.length-1)gaps[i+1].focus();
    else{const btn=app.querySelector('[data-act="checkcloze"]');if(btn)btn.click();}
    return;}
  if(/^f-(a|b|ex|name|cname|from|to)$/.test(e.target.id)){e.preventDefault();
    const btn=app.querySelector('[data-act^="save"]');if(btn)btn.click();}
});

document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const hit=sel=>{const b=app.querySelector(sel);if(b){e.preventDefault();b.click();return true}return false};
  if(view.name==="study"&&sess){
    if(typing)return;
    if(e.key===" "||e.key==="Enter")return void hit('[data-act="reveal"]');
    if(sess.shown&&/^[1-4]$/.test(e.key))return void hit('[data-act="grade"][data-a="'+(+e.key-1)+'"]');
    if(e.key==="Escape")return void hit('[data-act="endstudy"]');
  }
  if(view.name==="exercise"&&sess&&sess.q){
    if(sess.phase==="ask"&&sess.q.type==="mc"&&/^[1-4]$/.test(e.key)&&!typing){
      const opts=app.querySelectorAll('[data-act="pick"]');
      if(opts[+e.key-1]){e.preventDefault();opts[+e.key-1].click()}
      return;
    }
    if(sess.phase==="feedback"&&(e.key===" "||e.key==="Enter")&&!typing)return void hit('[data-act="nextq"]');
  }
  if(e.key==="Escape"&&!typing&&/^(list|cardform|bulk|themeform|courseform|settings|data)$/.test(view.name)){
    const back=app.querySelector(".bar .ghost");if(back){e.preventDefault();back.click()}
  }
});

/* ==================== Start ==================== */
async function boot(){
  let deckRaw=await store.get(KDECK), progRaw=await store.get(KPROG), migrated=false;
  if(deckRaw){try{deck=normalizeDeck(JSON.parse(deckRaw))}catch(err){}}
  if(!deck){
    const oldDeck=await store.get(OLD_DECK);
    if(oldDeck){try{deck=normalizeDeck(JSON.parse(oldDeck));migrated=!!deck}catch(err){}}
  }
  if(!deck)deck=normalizeDeck(SEED);

  if(progRaw){try{const p=normalizeProg(JSON.parse(progRaw));if(p)Object.assign(S,p)}catch(err){}}
  else{
    const oldProg=await store.get(OLD_PROG);
    if(oldProg){try{const p=normalizeProg(JSON.parse(oldProg));if(p){Object.assign(S,p);migrated=true}}catch(err){}}
  }
  if(S.day!==today()){S.day=today();S.newDone=0;}

  try{await store.set(KDECK,JSON.stringify(deck));await store.set(KPROG,JSON.stringify(S))}
  catch(err){storageNote="Dieser Browser lässt kein Speichern zu — der Stand gilt nur für diese Sitzung. Exportiere ihn, bevor du das Fenster schließt.";}

  view={name:"home"};
  if(migrated)view.msg="Bestehender Stand aus der alten Spanisch-Version übernommen.";
  render();
}
/* Geht beim Start etwas schief, soll das auf dem Bildschirm stehen — nicht nur in der Konsole. */
function fatal(what){
  if(!app)return;
  app.innerHTML='<p class="boot"><b>Die App konnte nicht starten.</b><br>'
    +'Bitte schick mir diese Meldung, dann finde ich die Ursache.'
    +'<code>'+esc(what)+'</code></p>';
}
window.addEventListener("error",e=>fatal((e.message||"Unbekannter Fehler")
  +(e.lineno?"  (Zeile "+e.lineno+")":"")));
window.addEventListener("unhandledrejection",e=>fatal(String((e.reason&&e.reason.message)||e.reason)));
boot().catch(err=>fatal(String((err&&err.message)||err)));
</script>
